name: CI

# Branch flow: dev → hom → main. CI runs on changes to main (pushes and pull requests)
# and on tags; it can also be started by hand from the Actions tab.
on:
    push:
        branches: [main]
        tags: ['*']
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    backend:
        name: PHP tests and Pint
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: clinical_saas_test
                    MYSQL_USER: clinical_user
                    MYSQL_PASSWORD: clinical_pass
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        env:
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_USERNAME: clinical_user
            DB_PASSWORD: clinical_pass

        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.6'
                  extensions: mbstring, pdo_mysql, bcmath, intl, zip, gd
                  coverage: none
                  tools: composer:v2

            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  path: ~/.composer/cache/files
                  key: composer-${{ hashFiles('composer.lock') }}

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate --ansi

            - name: Check formatting
              run: ./vendor/bin/pint --test

            - name: Run tests
              run: php artisan test

    frontend:
        name: Vue type check, tests and build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 26
                  cache: npm

            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
