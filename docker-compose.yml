services:
    app:
        build:
            context: ./
            dockerfile: Dockerfile
        container_name: clinical_saas_app
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        depends_on:
            - mysql

    mysql:
        image: mysql:8.0
        container_name: clinical_saas_db
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: clinical_saas
            MYSQL_USER: clinical_user
            MYSQL_PASSWORD: clinical_pass
        ports:
            - "3306:3306"
        volumes:
            - db-data:/var/lib/mysql
    node:
        image: node:20-alpine
        container_name: clinical_saas_node
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        command: sh -c "npm install && npm run dev"
        ports:
            - "5173:5173"
        depends_on:
            - app

    nginx:
        image: nginx:stable-alpine
        container_name: clinical_saas_nginx
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

volumes:
    db-data:
