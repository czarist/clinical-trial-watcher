services:
    app:
        build:
            context: ./
            dockerfile: Dockerfile
        image: clinical-trial-watcher-app
        container_name: clinical_saas_app
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        depends_on:
            - mysql

    queue:
        image: clinical-trial-watcher-app
        container_name: clinical_saas_queue
        working_dir: /var/www/html
        command: sh -c "until [ -f vendor/autoload.php ]; do sleep 5; done; php artisan queue:work --tries=3 --backoff=60"
        restart: unless-stopped
        volumes:
            - .:/var/www/html
        depends_on:
            - app
            - mysql

    scheduler:
        image: clinical-trial-watcher-app
        container_name: clinical_saas_scheduler
        working_dir: /var/www/html
        command: sh -c "until [ -f vendor/autoload.php ]; do sleep 5; done; php artisan schedule:work"
        restart: unless-stopped
        volumes:
            - .:/var/www/html
        depends_on:
            - app
            - mysql

    mysql:
        image: mysql:8.4
        container_name: clinical_saas_db
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: clinical_saas
            MYSQL_USER: clinical_user
            MYSQL_PASSWORD: clinical_pass
        ports:
            - "${FORWARD_DB_PORT:-3306}:3306"
        volumes:
            - db-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    node:
        image: node:26-alpine
        container_name: clinical_saas_node
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        command: sh -c "npm install && npm run dev"
        ports:
            - "${VITE_PORT:-5173}:5173"
        depends_on:
            - app

    nginx:
        image: nginx:stable-alpine
        container_name: clinical_saas_nginx
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - .:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

volumes:
    db-data:
